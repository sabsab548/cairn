name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: Protocol & sync (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew :packages:protocol:jvmTest :packages:sync:jvmTest --no-daemon

  desktop-harness:
    name: Meshtastic layer & desktop harness (JVM)
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: >-
          ./gradlew :packages:meshtastic:jvmTest
          :apps:desktop:desktopTest --no-daemon

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :apps:android:app:assembleDebug --no-daemon

  ios-build:
    name: iOS framework (stub)
    runs-on: macos-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Placeholder
        # TODO(ios): replace with
        #   ./gradlew :packages:protocol:linkDebugFrameworkIosSimulatorArm64
        # plus an xcodebuild step once apps/ios exists.
        run: echo "iOS app not wired yet — see apps/ios/TODO.md"
